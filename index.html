<style>
  :root { --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font); }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #eef1f5; }

  #status-banner {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    padding: 9px 16px; border-radius: 14px; font-size: 13px; font-weight: 500;
    z-index: 1000; display: none; box-shadow: 0 8px 24px rgba(16,24,40,.14);
    font-family: var(--font);
  }

  .brand {
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(15,23,42,.08); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(16,24,40,.12); padding: 9px 14px;
    font-weight: 700; font-size: 14px; color: #16181d; font-family: var(--font);
    display: flex; align-items: center; gap: 6px; direction: rtl;
  }
  .brand .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    background: #eef1f5; color: #5b6472; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: var(--font);
  }
  .brand .info-icon:hover { background: #e2e6eb; }
  .legend {
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(15,23,42,.08); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(16,24,40,.12); padding: 10px 12px;
    font-size: 12.5px; font-family: var(--font); color: #16181d;
  }
  .legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-toggle {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-weight: 600; user-select: none;
  }
  .legend-toggle .chevron { transition: transform .15s ease; }
  .legend.collapsed .legend-toggle .chevron { transform: rotate(-90deg); }
  .legend.collapsed .legend-rows { display: none; }
  .legend-rows { margin-top: 6px; }
  #info-modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    z-index: 2000; display: none; align-items: center; justify-content: center;
  }
  #info-modal {
    background: #fff; border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(16,24,40,.35); font-family: var(--font);
    max-width: 280px; width: calc(100% - 48px); text-align: center; position: relative;
  }
  #info-modal .info-close {
    position: absolute; top: 8px; right: 10px; border: none; background: none;
    font-size: 18px; line-height: 1; cursor: pointer; color: #9aa2ad; padding: 4px;
  }
  #info-modal .info-close:hover { color: #16181d; }
  #info-modal .info-name { font-weight: 700; font-size: 15px; color: #16181d; margin-bottom: 10px; }
  #info-modal a {
    display: inline-block; color: #2563eb; font-weight: 600; text-decoration: none; font-size: 13.5px;
  }
  #info-modal a:hover { text-decoration: underline; }
  .locate-btn {
    background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 50%;
    box-shadow: 0 8px 24px rgba(16,24,40,.12); width: 40px; height: 40px;

  .locate-btn:disabled { opacity: .6; cursor: default; }

    width: 14px; height: 14px; border-radius: 50%;

  .pin .letter {
    position: absolute; top: 5px; left: 0; width: 30px; text-align: center;
    font-family: var(--font); font-weight: 800; font-size: 12px;

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var API_URL = "https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2/MapServer/970/query" +
    "?where=1%3D1" +
    "&outFields=oid_hof,shem_chenyon,ktovet,lon,lat,status_chenyon,tr_status_chenyon,mispar_mekomot_bchenyon,taarif_yom,taarif_layla" +
    "&returnGeometry=false" +
    "&f=json";

  var REFRESH_INTERVAL_MS = 2 * 60 * 1000;

  var STATUS_INFO = {
    "פנוי":  { hex: "#16a34a", label: "פנוי (Available)" },
    "מעט":  { hex: "#d97706", label: "מעט מקומות (Few spaces)" },
    "מלא":  { hex: "#dc2626", label: "מלא (Full)" },
    "סגור": { hex: "#6b7280", label: "סגור (Closed)" },
    "פעיל": { hex: "#64748b", label: "לא ידוע (Status unknown)" }
  };
  var DEFAULT_STATUS = { hex: "#64748b", label: "לא ידוע (Status unknown)" };
  var STATUS_ORDER = ["פנוי", "מעט", "מלא", "פעיל"];

  function normalizeLotName(name) {
    return String(name == null ? "" : name).replace(/[\s\-()]/g, "");
  }

  // Generated from ahuzot-parking-lots.csv (id/name/link scraped from
  // https://www.ahuzot.co.il/Parking/All/). Keys are normalizeLotName()
  // applied to the CSV's name column, values are the lot's ahuzot.co.il ID
  // (build the full link with AHUZOT_LINK_BASE); re-generate this whole
  // block by hand if that CSV is ever regenerated.
  var AHUZOT_LINK_BASE = "https://www.ahuzot.co.il/Parking/ParkingDetails/?ID=";
  var AHUZOT_LINKS = {
    "ארלוזורובחנהוסע": 1,
    "בוגרשוב": 2,
    "בזל": 3,
    "חברהחדשה": 4,
    "בנידן": 7,
    "ברוריה": 8,
    "גולדה": 10,
    "גליגיל": 12,
    "גןהכובשים1מזרח": 13,
    "דובנוב": 15,
    "הארד": 16,
    "החשמל": 18,
    "הצפירה1": 19,
    "הצפירה2": 20,
    "ביתהאצ\"ל": 21,
    "פנחסרוזן": 23,
    "כרמל1": 24,
    "הלוחמים": 25,
    "לולאה": 26,
    "התחנה": 28,
    "מונטיפיורי": 29,
    "מפעלהפיס": 31,
    "מרכזים": 32,
    "מרד": 33,
    "נחושת": 34,
    "סינרמה": 37,
    "סעדיהגאון": 38,
    "פלמ\"ח": 39,
    "רבניצקי": 40,
    "רידינגמערב": 41,
    "שרתון": 42,
    "התקומה": 44,
    "תלנורדאו": 45,
    "מירשם": 48,
    "מדעיהחברה": 50,
    "רפואתשיניים": 53,
    "גליצה\"ל": 54,
    "הבעש\"ט": 55,
    "אבולעפיה": 56,
    "הרבקוק": 57,
    "ידאבנר": 58,
    "מיומי": 62,
    "מכללהלמינהלומכללתלוינסקי1": 63,
    "אחימאיר": 64,
    "סלודור": 65,
    "צבינישרי": 67,
    "רפידים": 68,
    "שלונסקי": 69,
    "מבצעקדש": 70,
    "ביתהחייל": 72,
    "פליטיהספר": 75,
    "טירתצבי": 76,
    "המערכה": 77,
    "טאגור": 79,
    "מכללתיפו": 80,
    "עירשמש": 81,
    "ביתצורי": 85,
    "ברזאני": 87,
    "בןיוסף2": 88,
    "וולפסון2": 89,
    "מכללהלמינהלומכללתלוינסקי3": 90,
    "מכללהלמינהלומכללתלוינסקי2": 91,
    "ביתהדר": 93,
    "התרבות": 94,
    "סמולרש": 95,
    "כלכלה": 96,
    "גולפיטק": 98,
    "גנייהושע": 99,
    "סוציאליתמעונות": 108,
    "אלוף": 110,
    "כרמל2": 114,
    "לסקוב": 119,
    "ליבר": 120,
    "המוזיאונים": 121,
    "אסותא": 122,
    "ארלוזורוב17": 123,
    "גולדמן": 124,
    "רידינגמזרח": 126,
    "צמרות": 127,
    "גןהכובשים2מערב": 129,
    "רמזארלוזורוב": 131,
    "כיכרעליה": 132,
    "המשתלה": 133,
    "חוףתלברוך": 134,
    "קצההשדרהרוטשילד1": 135,
    "כיתן": 137,
    "בןיוסף": 138,
    "סוללים": 140
  };

  function statusInfo(rawStatus) {
    var key = (rawStatus || "").trim();
    return STATUS_INFO[key] || DEFAULT_STATUS;
  }

  var map = L.map("map", { center: [32.08, 34.77], zoom: 13, zoomControl: false });

  L.control.zoom({ position: "topright" }).addTo(map);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    maxZoom: 19,
    attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a> &copy; OpenStreetMap contributors'
  }).addTo(map);

  var markersLayer = L.layerGroup().addTo(map);
  var userLocationLayer = L.layerGroup().addTo(map);

  var infoBackdrop = document.getElementById("info-modal-backdrop");
  function openInfoModal() {
    infoBackdrop.style.display = "flex";
  }
  function closeInfoModal() {
    infoBackdrop.style.display = "none";
  }
  document.querySelector("#info-modal .info-close").addEventListener("click", closeInfoModal);
  infoBackdrop.addEventListener("click", function (e) {
    if (e.target === infoBackdrop) closeInfoModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeInfoModal();
  });

  var BrandControl = L.Control.extend({
    options: { position: "topleft" },
    onAdd: function () {
      var div = L.DomUtil.create("div", "brand");
      div.appendChild(document.createTextNode("חניוני אחוזת החוף תל אביב"));

      var icon = document.createElement("span");
      icon.className = "info-icon";
      icon.textContent = "i";
      icon.title = "אודות (About)";
      L.DomEvent.on(icon, "click", function (e) {
        L.DomEvent.stopPropagation(e);
        openInfoModal();
      });
      div.appendChild(icon);

      L.DomEvent.disableClickPropagation(div);
      return div;
    }
  });
  new BrandControl().addTo(map);

  var LegendControl = L.Control.extend({
    options: { position: "bottomright" },
    onAdd: function () {
      var div = L.DomUtil.create("div", "legend collapsed");

      var toggle = document.createElement("div");
      toggle.className = "legend-toggle";
      var chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.textContent = "▾";
      toggle.appendChild(chevron);
      toggle.appendChild(document.createTextNode("מקרא (Legend)"));
      div.appendChild(toggle);

      var rows = document.createElement("div");
      rows.className = "legend-rows";
      STATUS_ORDER.forEach(function (key) {
        var info = STATUS_INFO[key];
        var row = document.createElement("div");
        row.className = "row";

        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = info.hex;
        row.appendChild(dot);
        row.appendChild(document.createTextNode(info.label));

        rows.appendChild(row);
      });
      div.appendChild(rows);

      L.DomEvent.on(toggle, "click", function (e) {
        L.DomEvent.stopPropagation(e);
        div.classList.toggle("collapsed");
      });
      L.DomEvent.disableClickPropagation(div);

      return div;
    }
  });
  new LegendControl().addTo(map);

  var LocateControl = L.Control.extend({
    options: { position: "bottomleft" },
    onAdd: function () {
      var btn = L.DomUtil.create("button", "locate-btn");
      btn.type = "button";
      btn.title = "מרכז מפה במיקומי (Center map on my location)";
      btn.textContent = "📍";
      L.DomEvent.on(btn, "click", function (e) {
        L.DomEvent.stopPropagation(e);
        btn.disabled = true;
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });
      });
      L.DomEvent.disableClickPropagation(btn);
      this._btn = btn;
      return btn;
    }
  });
  var locateControl = new LocateControl().addTo(map);

  map.on("locationfound", function (e) {
    locateControl._btn.disabled = false;
    userLocationLayer.clearLayers();
    L.marker(e.latlng, {
      icon: L.divIcon({ className: "", html: '<div class="user-location-dot"></div>', iconSize: [14, 14] }),
      interactive: false
    }).addTo(userLocationLayer);
  });

  map.on("locationerror", function (e) {
    locateControl._btn.disabled = false;
    showBanner("לא ניתן לאתר את המיקום שלך (Couldn't get your location) — " + e.message);
  });

  // Keeps popups clear of the fixed corner controls when Leaflet auto-pans
  // them into view -- without this, a popup near the top can end up under
  // the zoom control, and one near the bottom under the legend.
  var POPUP_AUTOPAN_PADDING = {
    autoPanPaddingTopLeft: L.point(16, 90),
    autoPanPaddingBottomRight: L.point(190, 160)
  };

  var banner = document.getElementById("status-banner");
  function showBanner(msg) {
    banner.textContent = msg;
    banner.style.display = "block";
  }
  function hideBanner() {
    banner.style.display = "none";
  }

  function formatUpdatedAt(epochMs) {
    if (!epochMs) return "לא ידוע (unknown)";
    // epochMs's Y/M/D h:m:s components are already Israel wall-clock time,
    // just mislabeled as UTC ms by the source API.
    // Formatting with timeZone: 'UTC' reads those components back out as-is;
    // do NOT switch this to plain toLocaleString() -- that would re-apply the
    // browser's local offset on top and reintroduce the ~3 hour display bug.
    return new Date(epochMs).toLocaleString('en-GB', { timeZone: 'UTC' });
  }

  // tr_status_chenyon encodes Israel local wall-clock time as if it were
  // UTC epoch ms (verified against the live API and against ahuzot.co.il's
  // own lot pages). To diff against it, "now" must be computed the same
  // way -- not with Date.now(), which is true UTC and would be off by
  // Israel's UTC offset (which itself changes across DST).
  function israelNowMs() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Jerusalem',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).formatToParts(new Date());

    var p = {};
    parts.forEach(function (part) { p[part.type] = part.value; });

    // Some environments format midnight as hour "24" under hour12:false.
    var hour = p.hour === '24' ? 0 : parseInt(p.hour, 10);

    return Date.UTC(
      parseInt(p.year, 10),
      parseInt(p.month, 10) - 1,
      parseInt(p.day, 10),
      hour,
      parseInt(p.minute, 10),
      parseInt(p.second, 10)
    );
  }

  function formatAgo(epochMs) {
    if (!epochMs) return "";
    var minutes = Math.floor(Math.max(0, israelNowMs() - epochMs) / 60000);
    if (minutes < 1) return "עכשיו (just now)";
    if (minutes < 60) return "לפני " + minutes + " דקות (" + minutes + " min ago)";
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return "לפני " + hours + " שעות (" + hours + " hr ago)";
    var days = Math.floor(hours / 24);
    return "לפני " + days + " ימים (" + days + " day" + (days === 1 ? "" : "s") + " ago)";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderLots(lots) {
    markersLayer.clearLayers();
    lots.forEach(function (lot) {
      if (typeof lot.lat !== "number" || typeof lot.lon !== "number") return;
      if ((lot.status || "").trim() === "סגור") return;
      var info = statusInfo(lot.status);

      var html =
        '<div class="pin"><svg width="30" height="40" viewBox="0 0 30 40">' +
        '<path d="M15 0C6.7 0 0 6.7 0 15c0 10 15 25 15 25s15-15 15-25C30 6.7 23.3 0 15 0z" fill="' + info.hex + '"/>' +
        '<circle cx="15" cy="15" r="7" fill="#fff"/></svg>' +
        '<span class="letter" style="color:' + info.hex + '">P</span>' +
        '</div>';
      var icon = L.divIcon({ html: html, className: "", iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -36] });
      var marker = L.marker([lot.lat, lot.lon], { icon: icon });

      var normalizedName = normalizeLotName(lot.name);
      var officialLink = Object.prototype.hasOwnProperty.call(AHUZOT_LINKS, normalizedName)
        ? AHUZOT_LINK_BASE + AHUZOT_LINKS[normalizedName]
        : undefined;

      // Prefer the lot's own street address for navigation, so the maps app
      // shows a recognizable destination the person can double-check against
      // this popup, instead of an opaque "32.08, 34.77" coordinate pair.
      // Fall back to lat/lon only for the rare lot missing an address.
      var hasAddress = !!(lot.address && lot.address.trim());
      var destination = hasAddress ? lot.address : (lot.lat + "," + lot.lon);
      var destinationParam = encodeURIComponent(destination);

      var popupHtml =
        '<div class="popup-title">' + escapeHtml(lot.name || "חניון (Parking lot)") + "</div>" +
        '<div class="popup-addr">' + escapeHtml(lot.address || "") + "</div>" +
        '<div class="popup-status" style="background:' + info.hex + '1a;color:' + info.hex + '">' + info.label + "</div>" +
        '<div class="popup-nav">' +
          '<a href="https://waze.com/ul?' + (hasAddress ? "q=" : "ll=") + destinationParam + '&navigate=yes" target="_blank" rel="noopener noreferrer">Waze ↗</a>' +
          '<a href="https://www.google.com/maps/dir/?api=1&destination=' + destinationParam + '" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>' +
        "</div>" +
        (lot.tariffDay ? '<div class="popup-row">' + escapeHtml(lot.tariffDay) + "</div>" : "") +
        (lot.tariffNight ? '<div class="popup-row">לילה (Night): ' + escapeHtml(lot.tariffNight) + "</div>" : "") +
        (lot.capacity ? '<div class="popup-row">קיבולת (Capacity): ' + escapeHtml(lot.capacity) + "</div>" : "") +
        '<div class="popup-updated">עודכן (Updated): ' + escapeHtml(formatUpdatedAt(lot.updatedAt)) +
          (lot.updatedAt ? ' (' + escapeHtml(formatAgo(lot.updatedAt)) + ')' : '') + "</div>" +
        (officialLink ? '<div class="popup-row"><a href="' + officialLink + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(officialLink) + '</a></div>' : "");

      marker.bindPopup(popupHtml, POPUP_AUTOPAN_PADDING);
      markersLayer.addLayer(marker);
    });
  }

  function parseLots(json) {
    if (!json || !Array.isArray(json.features)) return [];
    return json.features.map(function (f) {
      var a = f.attributes || {};
      return {
        id: a.oid_hof,
        name: a.shem_chenyon,
        address: a.ktovet,
        lat: typeof a.lat === "number" ? a.lat : parseFloat(a.lat),
        lon: typeof a.lon === "number" ? a.lon : parseFloat(a.lon),
        status: a.status_chenyon,
        updatedAt: a.tr_status_chenyon,
        capacity: a.mispar_mekomot_bchenyon,
        tariffDay: a.taarif_yom,
        tariffNight: a.taarif_layla
      };
    });
  }

  function loadData() {
    fetch(API_URL)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        if (json.error) throw new Error(json.error.message || "API error");
        var lots = parseLots(json);
        renderLots(lots);
        hideBanner();
      })
      .catch(function (err) {
        console.error("Failed to load parking data:", err);
        showBanner("לא ניתן לרענן את נתוני החניה, ננסה שוב (Couldn't refresh parking data, will retry) — " + err.message);
      });
  }

  // Pause polling while the tab/screen is in the background -- on mobile
  // this avoids burning battery/data refreshing a map nobody is looking
  // at. Refresh immediately on return, since the data may be stale.
  var refreshTimer = null;
  function startPolling() {
    if (refreshTimer) return;
    refreshTimer = setInterval(loadData, REFRESH_INTERVAL_MS);
  }
  function stopPolling() {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopPolling();
    } else {
      loadData();
      startPolling();
    }
  });

  loadData();
  startPolling();
})();
</script>
</body>
</html>
